# CI de l'usine — rejoue sur un serveur neutre ce que close-slice.sh et
# pre-push verifient en local. Le job s'appelle "ci" : c'est le nom exige
# par la regle de protection de main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Version fixe : ubuntu-latest change sous nos pieds (passage a Ubuntu 26 annonce).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      # Base jetable de la CI. Le mot de passe passe par PGPASSWORD (lu par pg
      # et psql) : aucune URL ne contient d'identifiants, meme factices.
      PGPASSWORD: ci_only_not_a_secret
      TEST_DATABASE_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
      # Tranche 001 (D-028). Valeurs inventees ; base jetable du service postgres.
      TEST_DATABASE_NAME: liste_courses_test
      TEST_APP_SCHEMAS: lc,lc_auth
      TEST_APP_ROLES: lc_owner,lc_app,lc_better_auth,lc_definer
      TEST_RLS_EXEMPT_TABLES: ""
      # Mots de passe des roles de connexion, poses par le globalSetup apres la
      # migration. Meme valeur que PGPASSWORD : les URL ci-dessous n'en portent
      # aucun, pg retombe sur PGPASSWORD (aucune etape ci:db-setup necessaire).
      TEST_ROLE_PASSWORDS: lc_app:ci_only_not_a_secret,lc_better_auth:ci_only_not_a_secret
      TEST_DATABASE_URL_APP: postgresql://lc_app@localhost:5432/liste_courses_test
      TEST_APP_BASE_URL: http://localhost:3210
      # Environnement du serveur de test (prefixe retire par tests/_factory/env.ts).
      TEST_SERVER_ENV_DATABASE_URL: postgresql://lc_app@localhost:5432/liste_courses_test
      TEST_SERVER_ENV_AUTH_DATABASE_URL: postgresql://lc_better_auth@localhost:5432/liste_courses_test
      TEST_SERVER_ENV_BETTER_AUTH_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      TEST_SERVER_ENV_BETTER_AUTH_URL: http://localhost:3210
      TEST_SERVER_ENV_APP_ENV: test
      # Limiteur coupe pour la suite : accepte seulement avec APP_ENV=test (ADR-0003).
      TEST_SERVER_ENV_AUTH_RATE_LIMIT: "off"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Version de pnpm lue dans package.json ("packageManager", impose par install-project).
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Controle de types et lint
        run: pnpm run check
      - name: Preparation base de test (propre au projet)
        run: pnpm run --if-present ci:db-setup
      - name: Tests
        run: pnpm test
      - name: Build
        # Meme commande qu'en local (close-slice.sh) : environnement de ci/build.env seul.
        run: bash scripts/ci-build.sh
      - name: Audit des dependances de production
        run: pnpm audit --prod --audit-level=high
      - name: Secrets dans l'historique de la PR
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
